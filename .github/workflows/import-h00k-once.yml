name: Import clean h00k source into hook
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-h00k-once.yml
permissions:
  contents: write
jobs:
  import-source:
    if: github.repository == 'maks37614/hook'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 1
      - name: Checkout pinned h00k source
        uses: actions/checkout@v4
        with:
          repository: maks37614/h00k
          ref: 89e6c3e849b6a77864f83908e80ab234e5d731e9
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Validate source and sensitive paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "89e6c3e849b6a77864f83908e80ab234e5d731e9"
          test -f source/compose.yaml
          test -f source/Dockerfile
          test -f source/desktop/package.json
          test -f source/.github/workflows/h00k-desktop-windows.yml
          test -f source/server/migrations/001_identity.sql
          test -f source/server.ts
          sensitive="$(git -C source ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$|(^|/)[^/]+\.(pem|p12|pfx|dump|sqlite|sqlite3|db)$' || true)"
          if [[ -n "$sensitive" ]]; then
            echo "::error::Potentially sensitive files found in source: $sensitive"
            exit 1
          fi
          echo "Verified pinned source commit and required code paths."
      - name: Import tracked source and push
        shell: bash
        run: |
          set -euo pipefail
          git -C source archive HEAD | tar -x -C target
          rm -f target/.github/workflows/import-h00k-once.yml
          test ! -f target/.env
          test ! -d target/node_modules
          cat > target/CLEAN_LINUX_RESTORE_UA.md <<'EOF'
          # h00k.top + h00k Desktop — чистий Linux

          Джерело: maks37614/h00k, commit 89e6c3e849b6a77864f83908e80ab234e5d731e9 (18.11.2026).
          Це копія вихідного коду h00k.top, Electron Desktop, Docker, SQL-міграцій, тестів та GitHub workflows.

          Без PostgreSQL-даних, старих користувачів, налаштувань профілю, Telegram-прив'язок, секретів VPS та .env.

          Щоб відновити на чистому Linux:
          1. Встановити Git, Docker Engine, Docker Compose plugin, reverse proxy з TLS.
          2. Клонувати https://github.com/maks37614/hook.git.
          3. Створити .env за .env.example, заповнивши секрети без збереження у GitHub.
          4. Створити порожню PostgreSQL 16 і застосувати міграції з server/migrations.
          5. Запустити docker compose up -d --build.
          6. Налаштувати HTTPS/WebSocket, SMTP, Telegram і перевірити всі модулі.
          7. Windows Desktop збирати окремо через .github/workflows/h00k-desktop-windows.yml.

          Важливо: Git-код не містить налаштувань, які існували лише на VPS. До перевстановлення VPS перевірити проксі, секрети та зовнішні інтеграції. Community і незалежні боти цим бекапом не переносяться.
          EOF
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "backup: complete h00k + desktop source at 89e6c3e8"
          git push origin HEAD:main
          echo "Clean source snapshot uploaded successfully."
